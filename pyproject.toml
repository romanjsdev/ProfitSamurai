[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profitsamurai"
version = "0.1.0"
description = "Yandex Market cabinet sync"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.22",
  "ruff>=0.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/profitsamurai"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["profitsamurai"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.security.APIKeyHeader",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = true
extraPaths = ["src"]
include = ["src", "tests"]
pythonVersion = "3.12"
